name: Bug report
description: Report a reproducible problem in Nebula
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private paths and other sensitive data before posting logs.
  - type: input
    id: version
    attributes:
      label: Nebula version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal host
      placeholder: Windows Terminal
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - cmd
        - powershell
        - pwsh
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep the example as small as possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
