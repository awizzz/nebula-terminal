name: Bug report
description: Something in Nebula Terminal doesn't work as expected
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please remove usernames, tokens and private paths before posting output or screenshots.
  - type: input
    id: version
    attributes:
      label: Nebula Terminal version
      description: Settings → About
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - PowerShell 7
        - Windows PowerShell
        - Command Prompt
        - Git Bash
        - WSL
        - Not shell-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new PowerShell tab
        2. Split right
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help a lot for display problems.
    validations:
      required: true
