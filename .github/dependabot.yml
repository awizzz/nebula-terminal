version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One pull request a week for everything that shouldn't break, so CI runs once.
    groups:
      npm:
        update-types: ["minor", "patch"]
    ignore:
      # The Tauri CLI refuses a crate and its npm package on different minor versions,
      # so minor bumps of Tauri packages are done on both sides together, by hand.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch releases together; a 0.x minor release can break, so each comes alone.
    groups:
      cargo:
        update-types: ["patch"]
    ignore:
      # Tauri crates move with their npm packages (see above).
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # windows-core has to match the version the windows crate is built on; they move together, by hand.
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
