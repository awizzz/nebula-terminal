name: Build Nebula

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/nebula.exe dist/Nebula.exe
          if (Test-Path Cargo.lock) { Copy-Item Cargo.lock dist/Cargo.lock }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Nebula.exe --generate-notes --title "Nebula ${{ github.ref_name }}"
