name: Build Nebula

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Prepare unsigned artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/nebula.exe dist/Nebula.exe

      - name: Upload unsigned build artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-windows-x64-unsigned
          path: dist/Nebula.exe
          if-no-files-found: error

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'nebula-shell' } | Select-Object -First 1
          if (-not $package) {
            throw 'Could not find the nebula-shell package in Cargo metadata.'
          }

          $expectedTag = "v$($package.version)"
          $actualTag = '${{ github.ref_name }}'

          if ($actualTag -ne $expectedTag) {
            throw "Release tag '$actualTag' does not match Cargo version '$expectedTag'."
          }

      - name: Require release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG'
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Release signing is not configured. Missing: $($missing -join ', '). No unsigned GitHub Release will be published."
          }

      - name: Sign release executable with SignPath
        if: startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Verify Authenticode signature
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Recurse -File -Filter Nebula.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'SignPath did not return Nebula.exe.'
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe.FullName release/Nebula.exe

          $signature = Get-AuthenticodeSignature release/Nebula.exe
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }

          if (-not $signature.SignerCertificate) {
            throw 'The signed executable has no signer certificate.'
          }

          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
          Write-Host "Certificate thumbprint: $($signature.SignerCertificate.Thumbprint)"

          $hash = (Get-FileHash release/Nebula.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nebula.exe" | Set-Content release/Nebula.exe.sha256 -Encoding ascii

      - name: Upload signed release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-windows-x64-signed
          path: |
            release/Nebula.exe
            release/Nebula.exe.sha256
          if-no-files-found: error

      - name: Publish signed GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release/Nebula.exe `
            release/Nebula.exe.sha256 `
            --verify-tag `
            --generate-notes `
            --title "Nebula ${{ github.ref_name }}"
