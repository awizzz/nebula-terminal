name: Build Nebula

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Prepare build artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/nebula.exe dist/Nebula.exe

      - name: Upload build artifact
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-windows-x64
          path: dist/Nebula.exe
          if-no-files-found: error

      - name: Determine version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'nebula-shell' } | Select-Object -First 1
          if (-not $package) {
            throw 'Could not find the nebula-shell package in Cargo metadata.'
          }

          $tag = "v$($package.version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            Write-Host "Release $tag already exists. Skipping publication."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $tag does not exist yet. It will be published from this main build."
            "publish=true" >> $env:GITHUB_OUTPUT
          }

          # `gh release view` legitimately returns 1 when the release is absent.
          # Explicitly finish successfully so that expected state does not fail the job.
          exit 0

      - name: Detect signing configuration
        if: steps.release.outputs.publish == 'true'
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $values = @($env:SIGNPATH_API_TOKEN, $env:SIGNPATH_ORGANIZATION_ID, $env:SIGNPATH_PROJECT_SLUG, $env:SIGNPATH_SIGNING_POLICY_SLUG)
          $enabled = -not ($values | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($enabled) {
            Write-Host 'SignPath configuration detected. This release will be signed.'
          } else {
            Write-Warning 'SignPath is not configured. This release will be published unsigned.'
          }

      - name: Sign release executable with SignPath
        if: steps.release.outputs.publish == 'true' && steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Prepare release assets
        if: steps.release.outputs.publish == 'true'
        id: release_assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $signed = '${{ steps.signing.outputs.enabled }}' -eq 'true'

          if ($signed) {
            $exe = Get-ChildItem -Path signed -Recurse -File -Filter Nebula.exe | Select-Object -First 1
            if (-not $exe) { throw 'SignPath did not return Nebula.exe.' }
            Copy-Item $exe.FullName release/Nebula.exe

            $signature = Get-AuthenticodeSignature release/Nebula.exe
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
            }
            Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
            'signed=true' >> $env:GITHUB_OUTPUT
          } else {
            Copy-Item dist/Nebula.exe release/Nebula.exe
            'signed=false' >> $env:GITHUB_OUTPUT
          }

          $hash = (Get-FileHash release/Nebula.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nebula.exe" | Set-Content release/Nebula.exe.sha256 -Encoding ascii

      - name: Upload release artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-windows-x64-release
          path: |
            release/Nebula.exe
            release/Nebula.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $signed = '${{ steps.release_assets.outputs.signed }}' -eq 'true'
          $title = if ($signed) { "Nebula $tag" } else { "Nebula $tag (unsigned)" }

          gh release create $tag `
            release/Nebula.exe `
            release/Nebula.exe.sha256 `
            --target "${{ github.sha }}" `
            --generate-notes `
            --title $title
