name: Fix native compile

on:
  push:
    branches: [feat/native-engine]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-engine
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/native.rs')
          text = p.read_text(encoding='utf-8')
          old = '''enum Connector {
              And,
              Or,
              Sequence,
          }'''.replace('          ', '')
          new = '''enum Connector {
              And,
              Or,
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Connector enum did not match')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          p = Path('src/platform.rs')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('                    "powershell.exe",', '                    "powershell.exe".to_string(),'),
              ('                    "pwsh.exe",', '                    "pwsh.exe".to_string(),'),
              ('                    "cmd.exe",', '                    "cmd.exe".to_string(),'),
          ]:
              if old not in text:
                  raise SystemExit(f'platform program literal not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          cargo fmt
          rm .github/workflows/fix-native-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compile native engine"
          git push origin HEAD:feat/native-engine
