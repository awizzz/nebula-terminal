name: Native engine migration

on:
  push:
    branches: [feat/native-engine]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-engine
          fetch-depth: 0

      - name: Apply migration
        run: python scripts/migrate_native.py

      - name: Format Rust
        run: cargo fmt

      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/native-migrate.yml .github/workflows/fix-migrate.yml scripts/migrate_native.py .native-migration-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate native command engine"
          git push origin HEAD:feat/native-engine
