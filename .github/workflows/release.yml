name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release / windows-x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $config = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -ne [string]$config.version) { throw "package.json and tauri.conf.json versions differ." }
          foreach ($manifest in @('src-tauri/Cargo.toml', 'crates/nebula-sh/Cargo.toml')) {
            $cargo = Select-String -Path $manifest -Pattern '^version = "(.+)"' | Select-Object -First 1
            if ($version -ne $cargo.Matches[0].Groups[1].Value) { throw "package.json and $manifest versions differ." }
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $requested = '${{ inputs.version }}'.TrimStart('v')
            if ($requested -ne $version) { throw "Requested version '$requested' does not match package version '$version'." }
            $tag = "v$requested"
          } else {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$version") { throw "Tag '$tag' does not match package version 'v$version'." }
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(($version -match '-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run build
          npm test
          node scripts/build-sidecar.mjs
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      - name: Build installers
        run: npm run tauri build

      # Windows on Arm, from this x64 runner. Only NSIS: WiX 3 can't make an ARM64 MSI.
      - name: Build the ARM64 installer
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $target = 'target/release'

          New-Item -ItemType Directory -Force release | Out-Null
          function New-Portable($arch, $folder) {
            $app = Join-Path $folder 'nebula-terminal.exe'
            $sidecar = Join-Path $folder 'nebula-sh.exe'
            if (-not (Test-Path $app) -or -not (Test-Path $sidecar)) { throw "The $arch executables were not built." }
            $portable = "release/Nebula-Terminal-$version-windows-$arch-portable"
            New-Item -ItemType Directory -Force $portable | Out-Null
            Copy-Item $app (Join-Path $portable 'Nebula Terminal.exe')
            Copy-Item $sidecar (Join-Path $portable 'nebula-sh.exe')
            Copy-Item README.md, LICENSE $portable
            Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -CompressionLevel Optimal
            Remove-Item -Recurse $portable
            return "$portable.zip"
          }
          $portable = New-Portable 'x64' $target
          $arm64 = 'target/aarch64-pc-windows-msvc/release'
          $portableArm64 = New-Portable 'arm64' $arm64

          $bundles = @()
          $bundles += Get-ChildItem "$target/bundle/nsis" -File -Filter '*.exe' -ErrorAction SilentlyContinue
          $bundles += Get-ChildItem "$target/bundle/msi" -File -Filter '*.msi' -ErrorAction SilentlyContinue
          $bundles += Get-ChildItem "$arm64/bundle/nsis" -File -Filter '*.exe' -ErrorAction SilentlyContinue
          if ($bundles.Count -lt 3) { throw 'Tauri did not produce every installer.' }
          # GitHub replaces spaces in asset names with dots. Use the published names here,
          # so SHA256SUMS.txt matches what people (and the in-app updater) download.
          foreach ($bundle in $bundles) { Copy-Item $bundle.FullName (Join-Path release ($bundle.Name -replace ' ', '.')) }

          ./scripts/scoop-manifest.ps1 -Version $version -Zip $portable -Arm64Zip $portableArm64 -Repository $env:GITHUB_REPOSITORY -Out release/nebula-terminal.json

          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content release/SHA256SUMS.txt -Encoding ascii
          }

          $lines = Get-Content CHANGELOG.md
          $start = -1; $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))(\s|$)") { $start = $i + 1; continue }
            if ($start -ge 0 -and $lines[$i] -match '^## ') { $end = $i; break }
          }
          if ($start -ge 0) { $lines[$start..($end - 1)] | Set-Content release-notes.md -Encoding utf8 }
          else { "Nebula Terminal $version" | Set-Content release-notes.md -Encoding utf8 }

      - name: Attest release files
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release/*.exe
            release/*.msi
            release/*.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create '${{ steps.version.outputs.tag }}' $assets `
            --target '${{ github.sha }}' `
            --title 'Nebula Terminal ${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md @flags
