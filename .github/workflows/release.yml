name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Release / version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          config=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$version" = "$config" ] || { echo "package.json and tauri.conf.json versions differ."; exit 1; }
          for manifest in src-tauri/Cargo.toml crates/nebula-sh/Cargo.toml; do
            cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -n 1)
            [ "$version" = "$cargo" ] || { echo "package.json and $manifest versions differ."; exit 1; }
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested=${REQUESTED#v}
            [ "$requested" = "$version" ] || { echo "Requested version '$requested' does not match package version '$version'."; exit 1; }
            tag="v$requested"
          else
            tag="${{ github.ref_name }}"
            [ "$tag" = "v$version" ] || { echo "Tag '$tag' does not match package version 'v$version'."; exit 1; }
          fi

          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists."; exit 1; fi

          prerelease=false
          case $version in *-*) prerelease=true ;; esac
          { echo "version=$version"; echo "tag=$tag"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  windows:
    name: Release / windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run build
          npm test
          node scripts/build-sidecar.mjs
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      - name: Build installers
        run: npm run tauri build

      # Windows on Arm, from this x64 runner. Only NSIS: WiX 3 can't make an ARM64 MSI.
      - name: Build the ARM64 installer
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $target = 'target/release'

          New-Item -ItemType Directory -Force release | Out-Null
          function New-Portable($arch, $folder) {
            $app = Join-Path $folder 'nebula-terminal.exe'
            $sidecar = Join-Path $folder 'nebula-sh.exe'
            if (-not (Test-Path $app) -or -not (Test-Path $sidecar)) { throw "The $arch executables were not built." }
            $portable = "release/Nebula-Terminal-$version-windows-$arch-portable"
            New-Item -ItemType Directory -Force $portable | Out-Null
            Copy-Item $app (Join-Path $portable 'Nebula Terminal.exe')
            Copy-Item $sidecar (Join-Path $portable 'nebula-sh.exe')
            Copy-Item README.md, LICENSE $portable
            Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -CompressionLevel Optimal
            Remove-Item -Recurse $portable
            return "$portable.zip"
          }
          $portable = New-Portable 'x64' $target
          $arm64 = 'target/aarch64-pc-windows-msvc/release'
          $portableArm64 = New-Portable 'arm64' $arm64

          $bundles = @()
          $bundles += Get-ChildItem "$target/bundle/nsis" -File -Filter '*.exe' -ErrorAction SilentlyContinue
          $bundles += Get-ChildItem "$target/bundle/msi" -File -Filter '*.msi' -ErrorAction SilentlyContinue
          $bundles += Get-ChildItem "$arm64/bundle/nsis" -File -Filter '*.exe' -ErrorAction SilentlyContinue
          if ($bundles.Count -lt 3) { throw 'Tauri did not produce every installer.' }
          # GitHub replaces spaces in asset names with dots. Use the published names here,
          # so SHA256SUMS.txt matches what people (and the in-app updater) download.
          foreach ($bundle in $bundles) { Copy-Item $bundle.FullName (Join-Path release ($bundle.Name -replace ' ', '.')) }

          ./scripts/scoop-manifest.ps1 -Version $version -Zip $portable -Arm64Zip $portableArm64 -Repository $env:GITHUB_REPOSITORY -Out release/nebula-terminal.json

      - name: Upload the Windows files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # Linux packages are built on Ubuntu 22.04, so they run on that glibc and anything newer.
  linux:
    name: Release / linux-${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      # The checks CI runs, once: the Arm build only has to build.
      - name: Validate
        if: matrix.arch == 'x64'
        run: |
          node scripts/build-sidecar.mjs
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      - name: Build packages
        run: npm run tauri build

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          bundle=target/release/bundle
          count=0
          # GitHub replaces spaces in asset names with dots: use the published names.
          for file in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            cp "$file" "release/${name// /.}"
            count=$((count + 1))
          done
          [ "$count" -eq 3 ] || { echo "Tauri did not produce every package."; ls -R "$bundle"; exit 1; }
          ls -l release

      - name: Upload the Linux files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / publish
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
          awk -v version="$VERSION" '
            index($0, "## " version) == 1 && (length($0) == length(version) + 3 || substr($0, length(version) + 4, 1) ~ /[ \t]/) { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Nebula Terminal $VERSION" > release-notes.md

      - name: Attest release files
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.AppImage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${{ needs.version.outputs.tag }}" release/* \
            --target "${{ github.sha }}" \
            --title "Nebula Terminal ${{ needs.version.outputs.version }}" \
            --notes-file release-notes.md "${flags[@]}"
