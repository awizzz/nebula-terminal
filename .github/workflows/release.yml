name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.4.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'nebula-shell' } | Select-Object -First 1
          if (-not $package) { throw 'Could not find nebula-shell in Cargo metadata.' }

          $version = $package.version
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $requested = '${{ inputs.version }}'.TrimStart('v')
            if ($requested -ne $version) {
              throw "Requested version '$requested' does not match Cargo.toml version '$version'."
            }
            $tag = "v$requested"
          } else {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$version") {
              throw "Git tag '$tag' does not match Cargo.toml version 'v$version'."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $env:GH_TOKEN = '${{ github.token }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists."
          }
          exit 0

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --locked --release

      - name: Prepare unsigned artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/nebula.exe dist/Nebula.exe

      - name: Upload unsigned artifact for signing
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Nebula-windows-x64-unsigned
          path: dist/Nebula.exe
          if-no-files-found: error
          retention-days: 7

      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $values = @(
            $env:SIGNPATH_API_TOKEN,
            $env:SIGNPATH_ORGANIZATION_ID,
            $env:SIGNPATH_PROJECT_SLUG,
            $env:SIGNPATH_SIGNING_POLICY_SLUG
          )
          $enabled = -not ($values | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign executable with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Prepare release files
        id: files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $signed = '${{ steps.signing.outputs.enabled }}' -eq 'true'

          if ($signed) {
            $exe = Get-ChildItem -Path signed -Recurse -File -Filter Nebula.exe | Select-Object -First 1
            if (-not $exe) { throw 'SignPath did not return Nebula.exe.' }
            Copy-Item $exe.FullName release/Nebula.exe
            $signature = Get-AuthenticodeSignature release/Nebula.exe
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
            }
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            Copy-Item dist/Nebula.exe release/Nebula.exe
            "signed=false" >> $env:GITHUB_OUTPUT
          }

          $hash = (Get-FileHash release/Nebula.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nebula.exe" | Set-Content release/Nebula.exe.sha256 -Encoding ascii

          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))(\s|$)") {
              $start = $i + 1
              continue
            }
            if ($start -ge 0 -and $lines[$i] -match '^## ') {
              $end = $i
              break
            }
          }
          if ($start -ge 0) {
            $lines[$start..($end - 1)] | Set-Content release/release-notes.md -Encoding utf8
          } else {
            "Nebula $version" | Set-Content release/release-notes.md -Encoding utf8
          }

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/Nebula.exe

      - name: Upload final release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Nebula-windows-x64-release
          path: |
            release/Nebula.exe
            release/Nebula.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $signed = '${{ steps.files.outputs.signed }}' -eq 'true'
          $title = if ($signed) { "Nebula $tag" } else { "Nebula $tag (unsigned)" }
          gh release create $tag `
            release/Nebula.exe `
            release/Nebula.exe.sha256 `
            --target '${{ github.sha }}' `
            --title $title `
            --notes-file release/release-notes.md
