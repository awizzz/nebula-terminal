name: Generate Terminal lockfiles

on:
  push:
    branches: ["feat/terminal-productization"]
    paths:
      - ".github/workflows/terminal-lockfiles.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/terminal-productization

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Generate lockfiles
        shell: pwsh
        run: |
          Push-Location apps/nebula-terminal
          npm install --package-lock-only
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          Pop-Location

      - name: Commit lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nebula-terminal/package-lock.json apps/nebula-terminal/src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfiles are already current."
            exit 0
          }
          git commit -m "chore: lock Nebula Terminal dependencies"
          git push origin HEAD:feat/terminal-productization
