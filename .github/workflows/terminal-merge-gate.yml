name: Terminal Merge Gate

on:
  push:
    branches:
      - feat/terminal-mvp
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  verify:
    name: Verify Terminal on Windows
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/nebula-terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  merge:
    name: Merge verified Terminal PR
    needs: verify
    if: ${{ github.ref == 'refs/heads/feat/terminal-mvp' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge the open PR for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head feat/terminal-mvp --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open PR found for feat/terminal-mvp -> main" >&2
            exit 1
          fi
          gh pr merge "$pr_number" --squash --delete-branch=false
