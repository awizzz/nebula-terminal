name: Apply Terminal pane close fix

on:
  push:
    branches: ["feat/terminal-productization"]
    paths:
      - ".github/workflows/terminal-pane-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/terminal-productization

      - name: Patch pane close behavior
        shell: pwsh
        run: |
          $path = 'apps/nebula-terminal/src/App.tsx'
          $content = Get-Content $path -Raw

          $oldBlock = @'
  const closeActivePane = useCallback(() => {
    if (!activeTab) return;
    if (activeTab.panes.length <= 1) {
      closeTab(activeTab.id);
      return;
    }
    setTabs((current) => current.map((tab) => {
      if (tab.id !== activeTab.id) return tab;
      const index = tab.panes.findIndex((pane) => pane.id === tab.activePaneId);
      const panes = tab.panes.filter((pane) => pane.id !== tab.activePaneId);
      const replacement = panes[Math.min(Math.max(index, 0), panes.length - 1)] ?? panes[0]!;
      return { ...tab, panes, activePaneId: replacement.id };
    }));
  }, [activeTab, closeTab]);
'@

          $newBlock = @'
  const closePane = useCallback((tabId: string, paneId: string) => {
    const targetTab = tabsRef.current.find((tab) => tab.id === tabId);
    if (!targetTab) return;
    if (targetTab.panes.length <= 1) {
      closeTab(tabId);
      return;
    }
    setTabs((current) => current.map((tab) => {
      if (tab.id !== tabId) return tab;
      const index = tab.panes.findIndex((pane) => pane.id === paneId);
      const panes = tab.panes.filter((pane) => pane.id !== paneId);
      if (index < 0 || panes.length === tab.panes.length) return tab;
      const activePaneId = tab.activePaneId === paneId
        ? (panes[Math.min(index, panes.length - 1)] ?? panes[0]!).id
        : tab.activePaneId;
      return { ...tab, panes, activePaneId };
    }));
  }, [closeTab]);

  const closeActivePane = useCallback(() => {
    if (!activeTab) return;
    closePane(activeTab.id, activeTab.activePaneId);
  }, [activeTab, closePane]);
'@

          $oldButton = '<button type="button" onClick={() => { setActivePane(tab.id, pane.id); if (pane.id === tab.activePaneId) closeActivePane(); }}>×</button>'
          $newButton = '<button type="button" onClick={() => closePane(tab.id, pane.id)}>×</button>'

          if (-not $content.Contains($oldBlock)) { throw 'Expected closeActivePane block was not found.' }
          if (-not $content.Contains($oldButton)) { throw 'Expected pane close button was not found.' }

          $content = $content.Replace($oldBlock, $newBlock).Replace($oldButton, $newButton)
          Set-Content $path $content -NoNewline -Encoding utf8

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nebula-terminal/src/App.tsx
          git commit -m "fix: close the requested Terminal pane directly"
          git push origin HEAD:feat/terminal-productization
