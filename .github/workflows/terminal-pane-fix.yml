name: Apply Terminal pane close fix

on:
  push:
    branches: ["feat/terminal-productization"]
    paths:
      - ".github/workflows/terminal-pane-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/terminal-productization

      - name: Patch pane close behavior
        shell: pwsh
        run: |
          $path = 'apps/nebula-terminal/src/App.tsx'
          $content = (Get-Content $path -Raw).Replace("`r`n", "`n")
          $oldBlock = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $newBlock = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $oldButton = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('PGJ1dHRvbiB0eXBlPSJidXR0b24iIG9uQ2xpY2s9eygpID0+IHsgc2V0QWN0aXZlUGFuZSh0YWIuaWQsIHBhbmUuaWQpOyBpZiAocGFuZS5pZCA9PT0gdGFiLmFjdGl2ZVBhbmVJZCkgY2xvc2VBY3RpdmVQYW5lKCk7IH19PsOXPC9idXR0b24+'))
          $newButton = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('PGJ1dHRvbiB0eXBlPSJidXR0b24iIG9uQ2xpY2s9eygpID0+IGNsb3NlUGFuZSh0YWIuaWQsIHBhbmUuaWQpfT7DlzwvYnV0dG9uPg=='))
          if (-not $content.Contains($oldBlock)) { throw 'Expected closeActivePane block was not found.' }
          if (-not $content.Contains($oldButton)) { throw 'Expected pane close button was not found.' }
          $content = $content.Replace($oldBlock, $newBlock).Replace($oldButton, $newButton)
          Set-Content $path $content -NoNewline -Encoding utf8

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/nebula-terminal/src/App.tsx
          git commit -m "fix: close the requested Terminal pane directly"
          git push origin HEAD:feat/terminal-productization
