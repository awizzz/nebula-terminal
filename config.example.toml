[general]
# "auto" follows the Windows display language. You can also use "fr-FR", "en-US", etc.
language = "auto"
# Supported command backends: native, cmd, powershell, pwsh
backend = "native"
show_banner = true
# Persistent history can be disabled entirely.
history_enabled = true
# Commands beginning with a space are not written to persistent history.
history_ignore_leading_space = true
history_limit = 10000

[ui]
animations = true
animation_speed_ms = 28
# aurora, minimal, compact, off
banner_style = "aurora"
show_tips = true
command_separator = false

[prompt]
template = "╭─ {status} {identity}{cwd}{git}{duration}{exit}"
indicator_line = "╰─{indicator} "
indicator = "❯"
multiline_indicator = "· "
show_git = true
show_duration = true
show_exit_code = true
show_user = false
show_hostname = false
show_time = false

[theme]
# Built-in presets: hypr, tokyo-night, catppuccin, nord, dracula, rose-pine, gruvbox
preset = "hypr"
foreground = "#CDD6F4"
muted = "#7F849C"
accent = "#89DCEB"
path = "#89B4FA"
git = "#CBA6F7"
success = "#A6E3A1"
warning = "#F9E2AF"
error = "#F38BA8"
admin = "#F38BA8"
panel = "#313244"

[aliases]
ll = "dir"
gs = "git status"

[env]
# EDITOR = "code"
