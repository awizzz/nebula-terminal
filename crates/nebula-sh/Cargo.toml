[package]
name = "nebula-sh"
version = "1.3.0"
description = "Nebula, a Linux-style command interpreter for Windows"
authors = ["Awizz"]
edition = "2021"
rust-version = "1.98"
license = "PolyForm-Shield-1.0.0"

[[bin]]
name = "nebula-sh"
path = "src/main.rs"

[dependencies]
ctrlc = "3.5.2"
crossterm = "0.29.0"
# diff and cmp, from the uutils diffutils project.
diffutils = "0.5.0"
glob = "0.3.4"
indexmap = "2.14.2"
jiff = "0.2.37"
nu-ansi-term = "0.50.3"
os_pipe = "1.2.3"
reedline = "0.52.0"
regex = "1.13.1"
# sed, from the uutils project. It is built on an older uucore, named here so Nebula
# can tell it which command it is running.
sed = "0.2.0"
# package.json scripts for completion.
serde_json = "1"
uucore_sed = { package = "uucore", version = "0.10.0" }
strsim = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
uucore = "0.12.0"
walkdir = "2.5.0"

# GNU coreutils, reimplemented by the uutils project. Only utilities that
# uutils supports on Windows are listed.
uu_base64 = "0.12.0"
uu_basename = "0.12.0"
uu_cat = "0.12.0"
uu_cksum = "0.12.0"
uu_comm = "0.12.0"
uu_cp = "0.12.0"
uu_cut = "0.12.0"
uu_date = "0.12.0"
uu_dd = "0.12.0"
uu_df = "0.12.0"
uu_dirname = "0.12.0"
uu_du = "0.12.0"
uu_echo = "0.12.0"
uu_env = "0.12.0"
uu_expand = "0.12.0"
uu_expr = "0.12.0"
uu_false = "0.12.0"
uu_fmt = "0.12.0"
uu_fold = "0.12.0"
uu_head = "0.12.0"
uu_hostname = "0.12.0"
uu_join = "0.12.0"
uu_ln = "0.12.0"
uu_ls = "0.12.0"
uu_md5sum = "0.12.0"
uu_mkdir = "0.12.0"
uu_mktemp = "0.12.0"
uu_more = "0.12.0"
uu_mv = "0.12.0"
uu_nl = "0.12.0"
uu_nproc = "0.12.0"
uu_numfmt = "0.12.0"
uu_od = "0.12.0"
uu_paste = "0.12.0"
uu_printenv = "0.12.0"
uu_printf = "0.12.0"
uu_pwd = "0.12.0"
uu_readlink = "0.12.0"
uu_realpath = "0.12.0"
uu_rm = "0.12.0"
uu_rmdir = "0.12.0"
uu_seq = "0.12.0"
uu_sha1sum = "0.12.0"
uu_sha256sum = "0.12.0"
uu_sha512sum = "0.12.0"
uu_shuf = "0.12.0"
uu_sleep = "0.12.0"
uu_sort = "0.12.0"
uu_split = "0.12.0"
uu_tac = "0.12.0"
uu_tail = "0.12.0"
uu_tee = "0.12.0"
uu_test = "0.12.0"
uu_touch = "0.12.0"
uu_tr = "0.12.0"
uu_true = "0.12.0"
uu_truncate = "0.12.0"
uu_uname = "0.12.0"
uu_unexpand = "0.12.0"
uu_uniq = "0.12.0"
uu_unlink = "0.12.0"
uu_wc = "0.12.0"
uu_whoami = "0.12.0"
uu_yes = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
