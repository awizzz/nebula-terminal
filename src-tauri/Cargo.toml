[package]
name = "nebula-terminal"
version = "1.3.0"
description = "Nebula Terminal, a terminal for Windows"
authors = ["Awizz"]
edition = "2021"
rust-version = "1.98"
license = "PolyForm-Shield-1.0.0"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.23"
portable-pty = "0.9.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.8.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_Threading"] }
# The COM macros of `windows` refer to `windows_core` by name.
windows-core = "0.62"
winreg = "0.56"
