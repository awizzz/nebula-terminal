[package]
name = "nebula-terminal"
version = "1.0.0"
description = "Nebula Terminal, a terminal for Windows"
authors = ["Awizz"]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.8.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
